name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  offline-checks:
    name: Lint, samples & offline assertion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check

  pack:
    name: Can it package?
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build unpacked dir (no installable artifacts in CI)
        run: npx electron-builder --dir
